<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", Arial, sans-serif;
            color: #1f2430;
            background: #f3f4f8;
        }

        .hidden { display: none !important; }

        /* =============== LOGIN PAGE =============== */
        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at 10% 10%, #ffd9e4 0, transparent 40%),
                radial-gradient(circle at 90% 90%, #d8ccff 0, transparent 45%),
                #f3f4f8;
        }

        .login-card {
            width: 400px;
            max-width: 100%;
            background: white;
            border-radius: 16px;
            padding: 36px 34px 30px;
            box-shadow: 0 1px 3px #0000001a, 0 20px 45px #4b2a7a1f;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 26px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff7aa2, #7c5cff);
            font-size: 18px;
        }

        .login-card h1 {
            margin: 0 0 4px;
            font-size: 26px;
            font-weight: 700;
        }

        .sub {
            margin: 0 0 22px;
            color: #6b7280;
            font-size: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin: 16px 0 6px;
        }

        .field { position: relative; }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            font: inherit;
            font-size: 15px;
            border: 1.5px solid #d9dce5;
            border-radius: 10px;
            background: white;
            color: #1f2430;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input:focus {
            border-color: #7c5cff;
            box-shadow: 0 0 0 4px #7c5cff26;
        }

        input.bad { border-color: #d92d4f; }

        .eye {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 10px;
            cursor: pointer;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 22px;
            font-size: 14px;
        }

        .row label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-weight: 400;
        }

        .row a {
            color: #6b4ce6;
            font-weight: 500;
            text-decoration: none;
        }

        .row a:hover { text-decoration: underline; }

        button {
            font: inherit;
            cursor: pointer;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 3px solid #7c5cff66;
            outline-offset: 2px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #ff7aa2, #7c5cff);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.15s, transform 0.1s;
        }

        .login-btn:hover { opacity: 0.93; }
        .login-btn:active { transform: scale(0.99); }
        .login-btn:disabled { opacity: 0.75; cursor: wait; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2.5px solid #ffffff66;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #error {
            min-height: 20px;
            margin: 14px 0 0;
            color: #d92d4f;
            font-size: 14px;
            text-align: center;
        }

        /* =============== APP PAGE (behind the question) =============== */
        #appPage { min-height: 100vh; }

        .topbar {
            height: 64px;
            background: white;
            border-bottom: 1px solid #e5e7ee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff7aa2, #7c5cff);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }

        .skeleton {
            height: 130px;
            border-radius: 14px;
            background: linear-gradient(90deg, #e9ebf2 25%, #f4f5f9 50%, #e9ebf2 75%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite;
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* =============== QUESTION POP-UP =============== */
        #overlay {
            position: fixed;
            inset: 0;
            background: #1f243066;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 20;
        }

        .modal {
            width: 380px;
            max-width: 100%;
            background: white;
            border-radius: 20px;
            padding: 34px 30px 30px;
            text-align: center;
            box-shadow: 0 25px 60px #00000040;
            animation: pop 0.35s ease;
        }

        @keyframes pop {
            0%   { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal .emoji { font-size: 52px; margin-bottom: 8px; }
        .modal h2 { margin: 0 0 6px; font-size: 26px; }
        .modal .sub { margin-bottom: 26px; }

        #buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .choice {
            padding: 12px 34px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            transition: transform 0.12s;
        }

        .choice:hover { transform: translateY(-2px); }

        #yesBtn { background: #22a06b; }
        #noBtn  { background: #e0425f; }

        /* Empty space that keeps Yes's place, so No never moves */
        #yesSlot { display: inline-block; }


        /* Final screen buttons */
        #actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
            animation: pop 0.35s ease;
        }

        #friendsBtn { background: linear-gradient(135deg, #ff7aa2, #7c5cff); }
        .ghost { background: #eef0f6; color: #3b4252; }

        #subtitle { min-height: 72px; }

        /* Colorful big title for the final message */
        .modal h2.final {
            font-size: 30px;
            line-height: 1.2;
            background: linear-gradient(135deg, #ff4f8b, #7c5cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Text fades in each time it changes */
        .fade { animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            0%   { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Blinking cursor while the message types */
        .typing::after {
            content: "|";
            margin-left: 2px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }


        /* Flower garden (shown after "Friends forever") */
        .flower {
            position: fixed;
            pointer-events: none;
            z-index: 25;
            transform: scale(0) rotate(-90deg);
            animation: bloom 1.1s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
            filter: drop-shadow(0 4px 6px #00000030);
        }

        @keyframes bloom {
            0%   { transform: scale(0) rotate(-90deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Flower emojis raining down */
        .fall {
            position: fixed;
            top: -60px;
            pointer-events: none;
            z-index: 50;
            animation: fallDown 4s linear forwards;
        }

        @keyframes fallDown {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(115vh) rotate(360deg); opacity: 0.9; }
        }

        /* Love emojis */
        .love {
            position: fixed;
            bottom: -60px;
            pointer-events: none;
            z-index: 50;
            animation: floatUp 3.2s ease-in forwards;
        }

        @keyframes floatUp {
            0%   { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-115vh) scale(1.4) rotate(25deg); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .skeleton { animation: none; }
        }
    </style>
</head>

<body>

    <!-- ============ LOGIN PAGE ============ -->
    <div id="loginPage">
        <div class="login-card">
            <div class="logo"><span class="logo-icon">💬</span> Hello</div>

            <h1>Sign in</h1>
            <p class="sub">Welcome back! Please enter your details.</p>

            <label for="username">Email or username</label>
            <input type="text" id="username" placeholder="you@gmail.com" autocomplete="off">

            <label for="password">Password</label>
            <div class="field">
                <input type="password" id="password" placeholder="Enter your password">
                <button type="button" class="eye" id="eye">Show</button>
            </div>

            <div class="row">
                <label><input type="checkbox"> Remember me</label>
                <a href="#" id="forgot">Forgot password?</a>
            </div>

            <button class="login-btn" id="loginBtn">Sign in</button>
            <p id="error"></p>
        </div>
    </div>

    <!-- ============ APP PAGE + QUESTION ============ -->
    <div id="appPage" class="hidden">
        <div class="topbar">
            <b>Hello</b>
            <div class="user"><span id="userName"></span><div class="avatar" id="avatar"></div></div>
        </div>
        <div class="content">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>

        <div id="overlay">
            <div class="modal">
                <div class="emoji" id="emoji">🥺</div>
                <h2 id="title">Are you my friend?</h2>
                <p class="sub" id="subtitle">Be honest...</p>

                <div id="buttons">
                    <span id="yesSlot"><button class="choice" id="yesBtn">Yes</button></span>
                    <button class="choice" id="noBtn">No</button>
                </div>

                <div id="actions" class="hidden">
                    <button class="choice" id="friendsBtn">Friends forever 🤝</button>
                    <button class="choice ghost" id="againBtn">Try again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function $(id) { return document.getElementById(id); }

        // ---------- Show / hide password ----------
        $("eye").addEventListener("click", function () {
            var box = $("password");
            if (box.type == "password") {
                box.type = "text";
                $("eye").innerText = "Hide";
            } else {
                box.type = "password";
                $("eye").innerText = "Show";
            }
        });

        $("forgot").addEventListener("click", function (e) {
            e.preventDefault();
            $("error").innerText = "Password reset is not available right now.";
        });

        // ---------- Login ----------
        function login() {
            var username = $("username").value.trim();
            var password = $("password").value;

            $("username").classList.toggle("bad", username == "");
            $("password").classList.toggle("bad", password == "");

            if (username == "" || password == "") {
                $("error").innerText = "Please enter your email and password.";
                return;
            }

            // Loading spinner so it feels real
            $("error").innerText = "";
            $("loginBtn").disabled = true;
            $("loginBtn").innerHTML = '<span class="spinner"></span> Signing in...';

            setTimeout(function () {
                var name = username.split("@")[0];
                name = name.charAt(0).toUpperCase() + name.slice(1);

                $("userName").innerText = name;
                $("avatar").innerText = name.charAt(0);

                $("loginPage").classList.add("hidden");
                $("appPage").classList.remove("hidden");
            }, 1200);
        }

        $("loginBtn").addEventListener("click", login);

        document.addEventListener("keydown", function (e) {
            if (e.key == "Enter" && !$("loginPage").classList.contains("hidden")) {
                login();
            }
        });

        // ---------- Yes button runs away ----------
        var yesBtn = $("yesBtn");

        function moveYes() {
            // First time: keep an empty space where Yes was, so No stays put
            if (yesBtn.parentNode.id == "yesSlot") {
                $("yesSlot").style.width = yesBtn.offsetWidth + "px";
                $("yesSlot").style.height = yesBtn.offsetHeight + "px";
                document.body.appendChild(yesBtn);
                yesBtn.style.position = "fixed";
                yesBtn.style.zIndex = 30;
            }

            var maxX = window.innerWidth - yesBtn.offsetWidth - 10;
            var maxY = window.innerHeight - yesBtn.offsetHeight - 10;

            yesBtn.style.left = 10 + Math.random() * maxX + "px";
            yesBtn.style.top = 10 + Math.random() * maxY + "px";
        }

        yesBtn.addEventListener("mouseover", moveYes);          // laptop

        yesBtn.addEventListener("touchstart", function (e) {    // phone
            e.preventDefault();
            moveYes();
        }, { passive: false });

        // ---------- No button (stays in place) ----------
        var timers = [];   // remembers timers so "Try again" can stop them

        $("noBtn").addEventListener("click", function () {
            // Step 1: the reaction
            setText("😏", "ohh is it", "I see how it is...");
            $("buttons").style.display = "none";
            yesBtn.style.display = "none";
            showHearts(45);

            // Step 2: the plot twist (after 2.5 seconds)
            timers.push(setTimeout(function () {
                var name = $("userName").innerText;
                setText("🥹", "Plot twist, " + name, "");
                typeText("You said no, but you still logged in just to see this. That is a real friend move.", function () {
                    // Step 3: show the two choices
                    $("actions").classList.remove("hidden");
                });
            }, 2500));
        });

        // Changes the emoji, title and small text (with a fade)
        function setText(emoji, title, sub) {
            $("emoji").innerText = emoji;
            $("title").innerText = title;
            $("subtitle").innerText = sub;
            [$("emoji"), $("title"), $("subtitle")].forEach(function (el) {
                el.classList.remove("fade");
                void el.offsetWidth;          // restarts the fade
                el.classList.add("fade");
            });
        }

        // Types a message one letter at a time
        function typeText(message, whenDone) {
            var box = $("subtitle");
            var i = 0;
            box.innerText = "";
            box.classList.add("typing");

            var t = setInterval(function () {
                box.innerText = message.slice(0, i + 1);
                i++;
                if (i >= message.length) {
                    clearInterval(t);
                    box.classList.remove("typing");
                    if (whenDone) { whenDone(); }
                }
            }, 40);
            timers.push(t);
        }

        // ---------- Flower garden ----------
        var flowerId = 0;   // gives every flower its own gradient names

        // Soft top-to-bottom color blend (top of the petal = tip)
        function blend(id, tip, base) {
            return '<linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
                   '<stop offset="0" stop-color="' + tip + '"/>' +
                   '<stop offset="1" stop-color="' + base + '"/></linearGradient>';
        }

        // Puts a petal shape around the center, again and again
        function ring(path, count, fill, stroke, startAngle, scale) {
            var out = "";
            for (var i = 0; i < count; i++) {
                var angle = startAngle + (360 / count) * i;
                out += '<path d="' + path + '" fill="' + fill + '" stroke="' + stroke +
                       '" stroke-width="0.7" stroke-linejoin="round" transform="rotate(' + angle +
                       ' 50 50) translate(50 50) scale(' + scale + ') translate(-50 -50)"/>';
            }
            return out;
        }

        // ---------- ROSE ----------
        function roseSVG() {
            var u = ++flowerId;
            var round = "M50 52 C 24 48, 18 18, 50 8 C 82 18, 76 48, 50 52 Z";
            var out = '<defs>' + blend("ra" + u, "#ff7d9a", "#d81b60") + blend("rb" + u, "#ff5c85", "#b0124a") +
                      blend("rc" + u, "#e8346f", "#8a0c3a") + blend("rl" + u, "#58c06a", "#1f7a3a") + '</defs>';

            // green leaves peeking out behind the flower
            for (var l = 0; l < 4; l++) {
                var a = 45 + l * 90;
                out += '<ellipse cx="50" cy="9" rx="8" ry="15" fill="url(#rl' + u + ')" transform="rotate(' + a + ' 50 50)"/>' +
                       '<line x1="50" y1="-2" x2="50" y2="20" stroke="#1f7a3a" stroke-width="0.8" transform="rotate(' + a + ' 50 50)"/>';
            }

            out += '<g transform="translate(50 50) scale(0.8) translate(-50 -50)">';
            out += ring(round, 5, "url(#ra" + u + ")", "#b0124a", 0, 1);
            out += ring(round, 5, "url(#rb" + u + ")", "#8a0c3a", 36, 0.78);
            out += ring(round, 4, "url(#rc" + u + ")", "#6d0a2e", 18, 0.52);
            // shiny edge on the big petals
            for (var i = 0; i < 5; i++) {
                out += '<path d="M34 24 C 40 14, 56 12, 66 18" fill="none" stroke="#ffffff" stroke-opacity="0.4" ' +
                       'stroke-width="2" stroke-linecap="round" transform="rotate(' + (i * 72) + ' 50 50)"/>';
            }
            out += '<circle cx="50" cy="50" r="9" fill="#a3103f"/>' +
                   '<path d="M50 43 C 58 44, 59 54, 51 57 C 44 58, 41 51, 45 47 C 48 44, 53 46, 52 50" ' +
                   'fill="none" stroke="#ff9fb9" stroke-width="1.6" stroke-linecap="round"/>';
            out += '</g>';
            return out;
        }

        // ---------- LOTUS ----------
        function lotusSVG() {
            var u = ++flowerId;
            var tipPetal = "M50 52 C 34 40, 36 14, 50 3 C 64 14, 66 40, 50 52 Z";
            var out = '<defs>' + blend("la" + u, "#f0629f", "#fff1f7") + blend("lb" + u, "#f58ab6", "#fff6fa") +
                      blend("lc" + u, "#ec5f9d", "#ffe4ef") + '</defs>';

            out += ring(tipPetal, 9, "url(#la" + u + ")", "#e377a6", 0, 1);
            out += ring(tipPetal, 9, "url(#lb" + u + ")", "#e377a6", 20, 0.84);
            out += ring(tipPetal, 7, "url(#lc" + u + ")", "#d9578f", 0, 0.62);
            // thin vein in the middle of each front petal
            for (var i = 0; i < 7; i++) {
                out += '<line x1="50" y1="46" x2="50" y2="22" stroke="#ffffff" stroke-opacity="0.55" ' +
                       'stroke-width="1.2" stroke-linecap="round" transform="rotate(' + (i * 360 / 7) + ' 50 50)"/>';
            }
            // yellow stamens around the middle
            for (var s = 0; s < 14; s++) {
                var ang = s * 360 / 14;
                out += '<line x1="50" y1="50" x2="50" y2="38" stroke="#f2d04a" stroke-width="1.2" transform="rotate(' + ang + ' 50 50)"/>' +
                       '<circle cx="50" cy="37" r="1.7" fill="#f7b500" transform="rotate(' + ang + ' 50 50)"/>';
            }
            out += '<circle cx="50" cy="50" r="7.5" fill="#d7d93a" stroke="#a9ad1c" stroke-width="0.8"/>';
            for (var d = 0; d < 7; d++) {
                var da = d * 360 / 7;
                out += '<circle cx="50" cy="46" r="1" fill="#7f8512" transform="rotate(' + da + ' 50 50)"/>';
            }
            out += '<circle cx="50" cy="50" r="1.3" fill="#7f8512"/>';
            return out;
        }

        // ---------- SUNFLOWER ----------
        function sunflowerSVG() {
            var u = ++flowerId;
            var thin = "M50 50 C 42 38, 42 14, 50 1 C 58 14, 58 38, 50 50 Z";
            var out = '<defs>' + blend("sa" + u, "#ffcf3a", "#f08a00") + blend("sb" + u, "#ffe570", "#ffb300") +
                      '<radialGradient id="sc' + u + '"><stop offset="0" stop-color="#2e1a08"/>' +
                      '<stop offset="1" stop-color="#6a3f17"/></radialGradient></defs>';

            out += ring(thin, 24, "url(#sa" + u + ")", "#c77400", 0, 1);
            out += ring(thin, 24, "url(#sb" + u + ")", "#d99a00", 7.5, 0.86);
            for (var i = 0; i < 24; i++) {
                out += '<line x1="50" y1="34" x2="50" y2="12" stroke="#c77400" stroke-opacity="0.45" stroke-width="0.7" ' +
                       'transform="rotate(' + (i * 15) + ' 50 50)"/>';
            }
            out += '<circle cx="50" cy="50" r="23" fill="url(#sc' + u + ')" stroke="#2e1a08" stroke-width="1"/>';
            // seeds in the natural spiral pattern
            for (var n = 1; n < 95; n++) {
                var r = 2.15 * Math.sqrt(n);
                var ang = n * 137.508 * Math.PI / 180;
                out += '<circle cx="' + (50 + r * Math.cos(ang)).toFixed(1) + '" cy="' + (50 + r * Math.sin(ang)).toFixed(1) +
                       '" r="1.15" fill="' + (n % 2 ? "#a7692a" : "#c98b43") + '"/>';
            }
            return out;
        }

        // ---------- LILY ----------
        function lilySVG() {
            var u = ++flowerId;
            var petal = "M50 50 C 28 40, 28 12, 50 1 C 72 12, 72 40, 50 50 Z";
            var out = '<defs>' + blend("ia" + u, "#ff7fb3", "#fff8fb") + blend("ib" + u, "#ff9cc6", "#ffffff") + '</defs>';

            // 3 back petals, then 3 front petals
            out += ring(petal, 3, "url(#ib" + u + ")", "#e58ab0", 60, 0.95);
            out += ring(petal, 3, "url(#ia" + u + ")", "#e0699a", 0, 1);

            for (var i = 0; i < 6; i++) {
                var rot = i * 60;
                out += '<line x1="50" y1="48" x2="50" y2="12" stroke="#f0558f" stroke-opacity="0.55" stroke-width="1.4" ' +
                       'stroke-linecap="round" transform="rotate(' + rot + ' 50 50)"/>';
                // small speckles near the middle of each petal
                for (var k = 0; k < 8; k++) {
                    var y = 22 + (k * 37 % 17) * 1.3;
                    var x = 50 + ((k * 53 % 9) - 4) * 1.5;
                    out += '<circle cx="' + x + '" cy="' + y + '" r="0.95" fill="#c2185b" fill-opacity="0.75" transform="rotate(' + rot + ' 50 50)"/>';
                }
            }
            // stamens with brown tips and one longer middle stem
            for (var s = 0; s < 6; s++) {
                var sa = s * 60 + 30;
                out += '<line x1="50" y1="50" x2="50" y2="25" stroke="#e8c97b" stroke-width="1.2" transform="rotate(' + sa + ' 50 50)"/>' +
                       '<ellipse cx="50" cy="24" rx="2.2" ry="4.2" fill="#8d3b0c" transform="rotate(' + sa + ' 50 50)"/>';
            }
            out += '<line x1="50" y1="50" x2="50" y2="22" stroke="#9ccc65" stroke-width="1.6" transform="rotate(8 50 50)"/>' +
                   '<circle cx="50" cy="22" r="2.4" fill="#7cb342" transform="rotate(8 50 50)"/>' +
                   '<circle cx="50" cy="50" r="4" fill="#c5e08a"/>';
            return out;
        }

        // Draws one flower picture (SVG): rose, lotus, sunflower or lily
        function makeFlower(size) {
            var types = [roseSVG, lotusSVG, sunflowerSVG, lilySVG];
            var draw = types[Math.floor(Math.random() * types.length)];

            var div = document.createElement("div");
            div.className = "flower";
            div.style.width = size + "px";
            div.style.height = size + "px";
            div.innerHTML = '<svg viewBox="0 0 100 100" width="100%" height="100%">' + draw() + '</svg>';
            return div;
        }

        // Fills the screen with flowers (but not on top of the message box)
        function flowerGarden(total) {
            var made = 0;
            var timer = setInterval(function () {
                for (var k = 0; k < 4 && made < total; k++) {
                    var size = 40 + Math.random() * 80;
                    var flower = makeFlower(size);
                    var spot = freeSpot(size);

                    flower.style.left = spot.x + "px";
                    flower.style.top = spot.y + "px";
                    document.body.appendChild(flower);
                    made++;
                }
                if (made >= total) {
                    clearInterval(timer);
                }
            }, 90);
            timers.push(timer);
        }

        // Finds a random place that does not cover the white message box
        function freeSpot(size) {
            var box = document.querySelector(".modal").getBoundingClientRect();
            var x, y, tries = 0;
            do {
                x = Math.random() * (window.innerWidth - size);
                y = Math.random() * (window.innerHeight - size);
                tries++;
            } while (tries < 15 &&
                     x + size > box.left - 10 && x < box.right + 10 &&
                     y + size > box.top - 10 && y < box.bottom + 10);
            return { x: x, y: y };
        }

        // Flower emojis falling from the top
        function flowerRain(rounds) {
            var items = ["🌹", "🪷", "🌻", "🌹", "🪷", "🌻", "💐", "✨"];
            var count = 0;
            var timer = setInterval(function () {
                for (var k = 0; k < 3; k++) {
                    var e = document.createElement("div");
                    e.className = "fall";
                    e.innerText = items[Math.floor(Math.random() * items.length)];
                    e.style.left = Math.random() * 96 + "vw";
                    e.style.fontSize = 24 + Math.random() * 36 + "px";
                    e.style.animationDuration = 3 + Math.random() * 2.5 + "s";
                    document.body.appendChild(e);
                    setTimeout(function (el) { el.remove(); }, 6000, e);
                }
                count++;
                if (count > rounds) {
                    clearInterval(timer);
                }
            }, 120);
            timers.push(timer);
        }

        // Removes all flowers (used by "Try again")
        function clearGarden() {
            document.querySelectorAll(".flower, .fall").forEach(function (el) { el.remove(); });
        }

        // "Friends forever" button
        $("friendsBtn").addEventListener("click", function () {
            setText("💖", "You are my best friend, Khatun", "Deal! No take-backs. Friends forever. 🌹");
            $("title").classList.add("final");
            $("friendsBtn").style.display = "none";
            showHearts(70);
            flowerGarden(70);
            flowerRain(60);
        });

        // "Try again" button: puts everything back like the start
        $("againBtn").addEventListener("click", function () {
            timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
            timers = [];
            clearGarden();
            $("title").classList.remove("final");

            setText("🥺", "Are you my friend?", "Be honest...");
            $("actions").classList.add("hidden");
            $("friendsBtn").style.display = "";
            $("buttons").style.display = "flex";

            // Put the Yes button back in its original spot
            $("yesSlot").appendChild(yesBtn);
            yesBtn.style.position = "";
            yesBtn.style.left = "";
            yesBtn.style.top = "";
            yesBtn.style.zIndex = "";
            yesBtn.style.display = "";
            $("yesSlot").style.width = "";
            $("yesSlot").style.height = "";
        });

        // Makes love emojis float up for a few seconds
        function showHearts(rounds) {
            var count = 0;
            var timer = setInterval(function () {
                loveEmoji();
                loveEmoji();
                count++;
                if (count > rounds) {
                    clearInterval(timer);
                }
            }, 100);
            timers.push(timer);
        }

        function loveEmoji() {
            var emojis = ["❤️", "💖", "💕", "😍", "💗", "😘", "💘", "🥰", "💝"];
            var heart = document.createElement("div");

            heart.className = "love";
            heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            heart.style.left = Math.random() * 95 + "vw";
            heart.style.fontSize = 22 + Math.random() * 34 + "px";

            document.body.appendChild(heart);
            setTimeout(function () { heart.remove(); }, 3300);
        }
    </script>

</body>
</html>
